                            SYNC
                        </button>
<button class="w-14 h-12 rounded-lg bg-surface-container-highest border border-white/10 hover:border-secondary flex items-center justify-center active:scale-95 transition-all text-on-surface-variant hover:text-secondary">
<span class="font-headline-sm text-[13px]">CUE</span>
</button>
<button class="w-16 h-14 rounded-xl bg-surface-container-highest border border-white/10 text-on-surface-variant hover:text-secondary hover:border-secondary font-bold flex items-center justify-center active:scale-95 transition-all">
<span class="material-symbols-outlined text-[32px]">play_arrow</span>
</button>
<button class="w-14 h-12 rounded-lg bg-surface-container-highest border border-white/10 hover:border-secondary flex items-center justify-center active:scale-95 transition-all text-on-surface-variant hover:text-secondary">
<span class="material-symbols-outlined text-[20px]">all_inclusive</span>
</button>
</div>
</div>
<div class="h-full w-10 flex flex-col items-center py-2 shrink-0">
<span class="font-label-mono-sm text-[9px] text-on-surface-variant mb-1">+10</span>
<div class="flex-1 w-1.5 bg-surface-container-lowest rounded-full border border-white/10 relative flex justify-center shadow-inner">
<div class="absolute top-1/2 w-4 h-[2px] bg-white/30 -translate-y-1/2"></div>
<div class="w-6 h-3 bg-surface-bright rounded-sm border border-outline absolute top-1/2 -translate-y-1/2 shadow-md flex items-center justify-center cursor-ns-resize z-10">
<div class="w-3 h-[2px] bg-secondary shadow-[0_0_6px_rgba(162,231,255,1)]"></div>
</div>
</div>
<span class="font-label-mono-sm text-[9px] text-on-surface-variant mt-1">-10</span>
</div>
</div>
</section>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const playBtnB = document.querySelector('section:nth-of-type(3) .material-symbols-outlined:contains("play_arrow")')?.closest('button');
            const platterB = document.getElementById('platter-b');
            
            if(playBtnB && platterB) {
                playBtnB.addEventListener('click', function() {
                    const icon = this.querySelector('.material-symbols-outlined');
                    if (icon.textContent === 'play_arrow') {
                        icon.textContent = 'pause';
                        this.classList.add('bg-secondary', 'text-on-secondary', 'shadow-[0_0_20px_rgba(162,231,255,0.7)]');
                        this.classList.remove('bg-surface-container-highest', 'text-on-surface-variant');
                        icon.classList.add('icon-fill');
                        platterB.classList.remove('spin-paused');
                    } else {
                        icon.textContent = 'play_arrow';
                        this.classList.remove('bg-secondary', 'text-on-secondary', 'shadow-[0_0_20px_rgba(162,231,255,0.7)]');
                        this.classList.add('bg-surface-container-highest', 'text-on-surface-variant');
                        icon.classList.remove('icon-fill');
                        platterB.classList.add('spin-paused');
                    }
                });
            }
        });
        
        HTMLElement.prototype.matchesContains = function(text) {
            return this.textContent.includes(text);
        };
    </script>
</body></html>
