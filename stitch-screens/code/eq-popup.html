<script>
        // Simple script to update value displays when sliders move
        const setupSlider = (id) => {
            const slider = document.getElementById(id);
            const display = document.getElementById(id.replace('eq-', 'val-'));
            
            if(slider && display) {
                slider.addEventListener('input', (e) => {
                    let val = parseFloat(e.target.value);
                    display.textContent = val > 0 ? '+' + val.toFixed(1) : val.toFixed(1);
                    
                    // Optional: Snap to zero detent slightly
                    if(Math.abs(val) < 0.3) {
                        slider.value = 0;
                        display.textContent = '0.0';
                    }
                });
            }
        };

        setupSlider('eq-a-low');
        setupSlider('eq-a-mid');
        setupSlider('eq-a-high');
        setupSlider('eq-b-low');
        setupSlider('eq-b-mid');
        setupSlider('eq-b-high');
    </script>
