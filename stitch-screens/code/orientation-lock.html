<style>
        /* Custom High-Visibility Rotation Animation */
        @keyframes force-landscape {
            0%, 15% { transform: rotate(0deg) scale(1); filter: drop-shadow(0 0 10px rgba(255, 177, 197, 0.4)); }
            45%, 55% { transform: rotate(-90deg) scale(1.1); filter: drop-shadow(0 0 25px rgba(255, 177, 197, 1)); }
            85%, 100% { transform: rotate(0deg) scale(1); filter: drop-shadow(0 0 10px rgba(255, 177, 197, 0.4)); }
        }
        .animate-force-landscape {
            animation: force-landscape 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* Subtle Background Grid for HUD feel */
        .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        
        /* Scanline effect */
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, transparent, rgba(162, 231, 255, 0.05), transparent);
            animation: scan 8s linear infinite;
            pointer-events: none;
        }
    </style>
