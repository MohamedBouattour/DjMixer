# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name wall-street.cloud www.wall-street.cloud;
    return 301 https://wall-street.cloud$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wall-street.cloud www.wall-street.cloud;

    # SSL Config
    ssl_certificate /etc/letsencrypt/live/wall-street.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wall-street.cloud/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1000;

    # 1. Portfolio Manager Frontend (SPA at Root)
    location / {
        root /mnt/main/portfolio/services/portfolio-manager-frontend/dist/frontend/browser;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2. Portfolio Manager BFF (API) proxied to NestJS BFF on port 3010
    location /api/ {
        proxy_pass http://127.0.0.1:3010/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Stockify Frontend (at /stockify/)
    location /stockify/ {
        alias /mnt/main/portfolio/apps/dashboard/dist/;
        try_files $uri $uri/ /stockify/index.html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Redirect for /stockify without trailing slash
    location = /stockify {
        return 301 /stockify/;
    }

    # 4. Stockify API proxied to NestJS on port 3001
    location /stockify/api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Bot routes proxied to NestJS on port 3001
    location /bot/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect /bot without trailing slash
    location = /bot {
        return 301 /bot/;
    }
}
